name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  web:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # 用 setup-node 而不是自己下 Node：Gitee Go 那个 build@nodejs 的
      # nodeVersion 字段不可信（官方只列到 15.12，写 22 时环境里根本没 node），
      # 当时只能自己 curl 下载。GitHub Actions 这里直接可靠。
      #
      # 版本 22.22.2 与本地验证时一致：vitest 5 要 ^22.12 || ^24 || >=26
      #（依赖 require(ESM)），低了会 ERR_REQUIRE_ESM。
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: 环境
        run: |
          node -v
          npm -v

      - name: install
        run: npm install --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      # build 必须在 test **之前**：`npm test` 里有静态服务相关的用例
      #（SPA 回退返回 index.html、目录穿越被拒、no-store 响应头），它们需要
      # dist/ 存在。CI 是全新检出没有 dist —— 放在测试后面就等于必红。
      - name: build
        run: npm run build

      # 失败时把「哪几条用例挂了」写进 **$GITHUB_STEP_SUMMARY**。
      # 只 echo 到日志是不够的 —— 日志是动态加载的，外部抓不到，
      # 而 step summary 会显示在 run 页面摘要区，看得见。
      - name: server tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee server-tests.log
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo '### server tests 失败'
              echo '```'
              grep -E "^✖|^not ok|AssertionError" server-tests.log | head -40
              echo '--- 日志末尾 ---'
              tail -40 server-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: ui tests
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee ui-tests.log
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "===== UI 失败摘要 ====="
            grep -iE "FAIL|✖|AssertionError" ui-tests.log | head -30
          fi
          exit $code
