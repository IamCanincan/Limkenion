name: npm audit

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      # 本项目运行时零依赖，所以 --omit=dev 之后没有任何东西可验签，npm 会直接报
      # "found no dependencies to audit that were installed from a supported registry" 并退出 1。
      # 去掉 --omit=dev，验的是实际装下来的开发依赖（约 28 个包）。
      - name: Verify registry signatures
        run: npm audit signatures
