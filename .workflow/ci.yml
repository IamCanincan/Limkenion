version: '1.0'
name: limkenion-ci
displayName: Limkenion CI（typecheck + 测试 + 构建）

# push 到 master 时自动触发
triggers:
  push:
    branches:
      precise:
        - master
  pr:
    branches:
      precise:
        - master

stages:
  - stage: ci
    displayName: 静态检查 + 单测 + 构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: ci-web
        displayName: web — typecheck / test / build
        # 必须是 22，不能是 20：vitest 5 的 engines 是 ^22.12.0 || ^24.0.0 || >=26.0.0，
        # 它依赖 Node 22.12+ 才有的 require(ESM)。在 Node 20 上 `npm run test:ui` 必炸：
        #   [vitest-pool]: Failed to start forks worker … ERR_REQUIRE_ESM
        # （typecheck / npm test / build 在 Node 20 上都正常，只有 UI 测试这一步不行。）
        # 服务本体在 Node 20 上能跑；这里升到 22 是为了让**测试工具链**能跑。
        nodeVersion: '22'
        commands:
          - |
            set -e
            cd web
            npm install --no-audit --no-fund
            echo '== typecheck =='
            npm run typecheck
            echo '== server tests =='
            npm test
            echo '== ui tests =='
            npm run test:ui
            echo '== build =='
            npm run build
            echo '== CI GREEN =='
