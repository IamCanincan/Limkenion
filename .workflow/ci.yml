version: '1.0'
name: limkenion-ci
displayName: Limkenion CI（typecheck + 测试 + 构建）

# push 到 master 时自动触发
triggers:
  push:
    branches:
      precise:
        - master
  pr:
    branches:
      precise:
        - master

stages:
  - stage: ci
    displayName: 静态检查 + 单测 + 构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: ci-web
        displayName: web — typecheck / test / build
        # ⚠️ 这个值**可能不生效** —— 别盲信它：
        #   · Gitee 官方文档里 build@nodejs 的 nodeVersion 只列到 15.12；
        #   · 容器镜像名 `ubuntu:plugin-24` 里的 24 是**插件**版本，不是 Node 版本。
        # 所以实际 Node 是几，一律以下面 `node -v` 的输出为准。
        #
        # 为什么想用 22：vitest 5 的 engines 是 ^22.12.0 || ^24.0.0 || >=26.0.0，
        # 依赖 Node 22.12+ 才有的 require(ESM)。实测 Node 20 上 `npm run test:ui`
        # 必炸：[vitest-pool]: Failed to start forks worker … ERR_REQUIRE_ESM
        # （typecheck / npm test / build 在 Node 20 上都正常，只有 UI 测试不行。）
        # 服务本体在 Node 20 上能跑，这里只是为了让**测试工具链**能跑。
        # 万一实际 Node 不够，下面会自动跳过 UI 测试并打印警告，而不是让流水线变红。
        nodeVersion: '22'
        commands:
          - |
            set -e
            # 失败时把「到底哪一条命令挂的」说清楚：光有 step 级的 "exited with code 1"
            # 定位不了问题（Gitee Go 不会告诉你是哪行）。
            fail() { echo ""; echo "########## ❌ 失败于：$1 ##########"; exit 1; }
            echo '== 环境 =='
            node -v || fail 'node -v'
            npm -v || fail 'npm -v'
            pwd
            ls -la | head -20
            cd web
            echo '== install =='
            npm install --no-audit --no-fund || fail 'npm install（依赖装不上？看上面的网络/registry 报错）'
            echo '== typecheck =='
            npm run typecheck || fail 'typecheck'
            echo '== server tests =='
            npm test || fail 'server tests'
            echo '== ui tests =='
            # vitest 5 要求 Node ^22.12 || ^24 || >=26（依赖 require(ESM)）。
            # 但 Gitee 的 build@nodejs 官方列出的 nodeVersion 只到 15.12，
            # 而容器镜像名里的 "plugin-24" 是插件版本、不是 Node 版本 —— 所以实际
            # Node 到底是几，只能靠上面的 `node -v` 说话。
            # 版本不够时**明说跳过**而不是让整条流水线变红：那是环境问题，不是代码问题。
            if node -e "const p=process.versions.node.split('.').map(Number);process.exit(p[0]>22||(p[0]===22&&p[1]>=12)?0:1)"; then
              npm run test:ui || fail 'ui tests'
            else
              echo "⚠️ 跳过 UI 测试：vitest 5 需要 Node 22.12+，当前 $(node -v)"
            fi
            echo '== build =='
            npm run build
            echo '== CI GREEN =='
