version: '1.0'
name: limkenion-ci
displayName: Limkenion CI（typecheck + 测试 + 构建）

# push 到 master 时自动触发
triggers:
  push:
    branches:
      precise:
        - master
  pr:
    branches:
      precise:
        - master

stages:
  - stage: ci
    displayName: 静态检查 + 单测 + 构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: ci-web
        displayName: web — typecheck / test / build
        # ⚠️ 这个字段**不可信**，别指望它：
        #   · Gitee 官方文档里 build@nodejs 的 nodeVersion 只列到 15.12；
        #   · 实测写 '22' 时环境里**根本没有 node/npm**（node: command not found）；
        #   · 容器镜像名 `ubuntu:plugin-24` 里的 24 是**插件**版本，不是 Node 版本。
        # 所以真正的 Node 由下面**自己下载安装**，这个字段只是让插件别报错。
        nodeVersion: '14.16.0'
        commands:
          - |
            set -e
            # 失败时把「到底哪一条命令挂的」说清楚：光有 step 级的 "exited with code 1"
            # 定位不了问题（Gitee Go 不会告诉你是哪行）。
            fail() { echo ""; echo "########## ❌ 失败于：$1 ##########"; exit 1; }

            # ---- 自己装 Node（不依赖上面那个不靠谱的 nodeVersion）----
            # vitest 5 要 ^22.12 || ^24 || >=26（依赖 require(ESM)），本地就是用
            # 22.22.2 验证的，这里保持一致，避免又来一次"本地绿、CI 红"。
            NODE_VER=22.22.2
            NODE_DIR=/opt/node-v$NODE_VER-linux-x64
            if [ ! -x "$NODE_DIR/bin/node" ]; then
              echo "== 下载 Node $NODE_VER =="
              # 用 .tar.gz 而不是 .tar.xz：后者要 xz 工具，精简镜像里可能没有。
              curl -fsSL "https://registry.npmmirror.com/-/binary/node/v$NODE_VER/node-v$NODE_VER-linux-x64.tar.gz" -o /tmp/node.tar.gz || fail '下载 Node'
              tar -xzf /tmp/node.tar.gz -C /opt || fail '解压 Node'
            fi
            export PATH="$NODE_DIR/bin:$PATH"

            echo '== 环境 =='
            node -v || fail 'node -v'
            npm -v || fail 'npm -v'
            pwd
            ls -la | head -20
            cd web
            echo '== install =='
            npm install --no-audit --no-fund || fail 'npm install（依赖装不上？看上面的网络/registry 报错）'
            echo '== typecheck =='
            npm run typecheck || fail 'typecheck'
            echo '== server tests =='
            npm test || fail 'server tests'
            echo '== ui tests =='
            # vitest 5 要求 Node ^22.12 || ^24 || >=26（依赖 require(ESM)）。
            # 但 Gitee 的 build@nodejs 官方列出的 nodeVersion 只到 15.12，
            # 而容器镜像名里的 "plugin-24" 是插件版本、不是 Node 版本 —— 所以实际
            # Node 到底是几，只能靠上面的 `node -v` 说话。
            # 版本不够时**明说跳过**而不是让整条流水线变红：那是环境问题，不是代码问题。
            if node -e "const p=process.versions.node.split('.').map(Number);process.exit(p[0]>22||(p[0]===22&&p[1]>=12)?0:1)"; then
              npm run test:ui || fail 'ui tests'
            else
              echo "⚠️ 跳过 UI 测试：vitest 5 需要 Node 22.12+，当前 $(node -v)"
            fi
            echo '== build =='
            npm run build
            echo '== CI GREEN =='
